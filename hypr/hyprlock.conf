# ROG Mech lock screen — blurred wallpaper, chrome type, red accents
$font   = IoskeleyMonoNL NFM SC
$chrome = rgba(238, 242, 246, 0.95)
$steel  = rgba(135, 148, 166, 0.85)
$red    = rgba(255, 34, 51, 1.0)
$volt   = rgba(184, 212, 255, 1.0)

background {
    monitor =
    path = ~/.config/hypr/wallpapers/rog_mech.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] date +"󰥔 %I:%M:%S %p"
    color = $chrome
    font_size = 90
    font_family = $font
    shadow_passes = 2
    shadow_color = rgba(255, 34, 51, 0.6)
    shadow_size = 6
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +" %A, %B %d, %Y"
    color = $steel
    font_size = 24
    font_family = $font
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text =   + X: leave Hyprland |   + S: Shutdown |   + R: reboot
    color = rgba(135, 148, 166, 0.6)
    font_size = 14
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    rounding = 0
    dots_center = true
    position = 0, -50
    halign = center
    valign = center
    inner_color = rgba(11, 16, 21, 0.7)
    outer_color = $red
    font_color = $chrome
    dots_color = $chrome
    check_color = $volt
    fail_color = rgba(255, 85, 102, 1.0)
    placeholder_text = <span foreground="##8794a6">password</span>
}

label {
    monitor =
    text = Linux is love, Linux is life  
    color = $steel
    font_size = 20
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "Powered by  Debian $(awk -F'"' '/^VERSION_ID/ {print $2}' /etc/os-release) $(awk -F'=' '/^VERSION_CODENAME/ {print $2}' /etc/os-release)"
    color = $red
    font_size = 14
    font_family = $font
    position = 0, 50
    halign = center
    valign = bottom
}
