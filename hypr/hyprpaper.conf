# ROG Mech wallpaper — lives in the repo so the theme is self-contained
# rog_mech.jpg with the fence at 45% brightness and the logo's red lifted
$wall = ~/.config/hypr/wallpapers/rog_mech_dark.jpg

# Left monitor
wallpaper {
    monitor = HDMI-A-1
    path = $wall
    fit_mode = cover
}

# Centre monitor
wallpaper {
    monitor = DP-2
    path = $wall
    fit_mode = cover
}

# Right monitor
wallpaper {
    monitor = DP-1
    path = $wall
    fit_mode = cover
}
