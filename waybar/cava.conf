# ROG Mech — cava for the custom/cava pill, read by scripts/cava.sh.
# The [input] section is added by scripts/cava.sh, which points it at the current
# output (cava's "auto" input picks a silent device here).
[general]
bars = 10
framerate = 24

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
