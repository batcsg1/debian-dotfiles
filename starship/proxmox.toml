"$schema" = 'https://starship.rs/config-schema.json'

# Proxmox — the ROG Mech prompt (starship.toml) recoloured in Proxmox orange and
# charcoal. Copy to ~/.config/starship.toml on the Proxmox host.

add_newline = true
palette = 'proxmox'

format = """
[┌](bold fg:red)$os$shell$username$hostname$time
[└](bold fg:steel)$directory$git_branch$git_status
$character"""

# same slot names as rog_mech so the layout below stays identical
[palettes.proxmox]
crust = '#000000'
surface0 = '#1a1a1a'
surface1 = '#262626'
surface2 = '#3c3c3c'
steel = '#a0a0a0'
chrome = '#f2f2f2'
red = '#e57000'        # Proxmox orange
red_bright = '#ff9a3c'
volt = '#ffc27a'

# ── line 1: os / shell / user / host / time ──────────────────────

[os]
disabled = false
format = '[ $symbol \(Proxmox\) ](bold bg:red fg:crust)'

[os.symbols]
Debian = ""  # Proxmox VE reports Debian; shown as the Proxmox logo
Ubuntu = ""
Arch = ""
Fedora = ""
Windows = ""
Macos = ""
Linux = ""

[shell]
disabled = false
bash_indicator = 'bash'
zsh_indicator = 'zsh'
fish_indicator = 'fish'
powershell_indicator = 'pwsh'
unknown_indicator = 'sh'
format = '[](bg:surface2 fg:red)[  $indicator ](bold bg:surface2 fg:chrome)'

[username]
show_always = true
style_user = 'bold bg:surface1 fg:chrome'
style_root = 'bold bg:surface1 fg:red'
format = '[](bg:surface1 fg:surface2)[  $user/]($style)'

[hostname]
ssh_only = false
format = '[$hostname ](bold bg:surface1 fg:chrome)'

[time]
disabled = false
time_format = '%H:%M'
format = '[](bg:surface0 fg:surface1)[  $time ](bold bg:surface0 fg:steel)[](fg:surface0)'

# ── line 2: directory + git ──────────────────────────────────────

[directory]
format = '[\[ ](bold fg:steel)[$path](bold fg:chrome)[$read_only](fg:red)[ \]](fg:steel)'
read_only = ' 󰌾'
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'
home_symbol = '~'

[git_branch]
symbol = ' '
format = ' [$symbol$branch](bold fg:volt)'

[git_status]
format = '[ $all_status$ahead_behind](fg:red_bright)'

# ── line 3: prompt char ──────────────────────────────────────────

[character]
success_symbol = '[❯](bold fg:surface2)[❯](bold fg:steel)[❯](bold fg:red)'
error_symbol = '[❯❯❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:volt)'
